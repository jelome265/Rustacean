# Security checks for every change and on a weekly schedule.
#
# Least privilege: jobs read repository contents only. Nothing here writes to the
# repository, comments on pull requests, or uses a long-lived secret.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          # Accepted exceptions for bundled npm 12.2.0 dependencies. Source of truth:
          # tools/npm-publish/advisory-allowlist.json (owner, reason, expiry 2026-12-31).
          # Remove an ID here when its entry is removed there.
          allow-ghsas: GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p, GHSA-ch52-4w7c-c8xp, GHSA-rfgv-xxqx-mfg5

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Full history: a secret removed in a later commit is still a leaked secret.
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  npm-tooling-audit:
    name: npm-tooling-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false

      - name: Install the lockfile-pinned npm tooling
        run: npm ci --prefix tools/npm-publish --ignore-scripts --no-audit --no-fund

      - name: Audit the tooling lockfile
        run: |
          # npm audit exits non-zero when advisories exist. The allow-list check below
          # decides pass or fail, so the exit code is captured rather than trusted.
          npm audit --prefix tools/npm-publish --package-lock-only --json > npm-audit.json || true
          python3 tools/check_npm_audit.py --audit-json npm-audit.json --allowlist tools/npm-publish/advisory-allowlist.json

  python-dependency-audit:
    name: python-dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned CI tools
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Audit Python dependencies for known vulnerabilities
        run: pip-audit --requirement requirements-ci.txt --strict --progress-spinner off

  rust-dependency-audit:
    name: rust-dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo uses the exact version pinned by rust-toolchain.toml.
      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit locked Rust dependencies
        run: cargo audit --deny warnings
