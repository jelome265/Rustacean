# Publish rustacean-skills to npm.
#
# Called by release.yml after release-please creates a release (tag = v<version>).
# Can also be run manually from main for recovery (workflow_dispatch); a manual run
# must not be used to publish a version that release-please did not produce.
#
# Authentication: the NPM_TOKEN secret in the npm-publish environment (granular,
# publish-only, expiring). After the first release, switch to npm trusted publishing
# (OIDC) and delete NPM_TOKEN; remove the setup-node registry step when doing so.
#
# Security properties:
#   * Default permissions are empty; the publish job gets id-token: write only.
#   * No tag or pull_request trigger. Fork code never sees the secret.
#   * The job runs in the protected environment npm-publish: a required reviewer
#     approves each publish.
#   * Refuses to publish unless: the tag's commit is an ancestor of main and is the
#     commit being built; version sources agree; CHANGELOG has a dated section for
#     the version; the version is newer than the version on npm; and the npm lookup
#     succeeded (an unreachable registry fails closed).
#   * Every action is pinned to a full commit SHA. Checkout does not persist credentials.
name: publish-npm

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag created by release-please, for example v0.1.0. Empty for manual runs."
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: publish rustacean-skills
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write  # OIDC identity for npm trusted publishing and provenance attestation
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # needed to prove the tag is on main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false  # a publishing job must not restore caches

      - name: Install pinned npm from lockfile
        run: |
          npm ci --prefix tools/npm-publish --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/tools/npm-publish/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Confirm npm supports trusted publishing
        run: |
          VERSION=$(npm --version)
          echo "npm $VERSION"
          test "$VERSION" = "12.2.0" || { echo "expected npm 12.2.0 from the lockfile" >&2; exit 1; }

      - name: Verify the release commit is on main
        env:
          TAG: ${{ inputs.tag }}
          REF_FULL: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF_FULL" != "refs/heads/main" ]; then
            echo "publish must run from main, not $REF_FULL" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if [ -n "$TAG" ]; then
            git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
            TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
            if ! git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/main; then
              echo "tag $TAG does not point at a commit on main" >&2
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$TAG_SHA" ]; then
              echo "checked-out commit is not the commit tagged $TAG" >&2
              exit 1
            fi
            echo "tag $TAG is on main at $TAG_SHA"
          fi

      - name: Check release policy
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          # Fail closed. Only a clean "not found" means unpublished. Any other failure
          # (network, registry error) stops the release instead of skipping the check.
          set +e
          OUT=$(npm view "$NAME" version 2>&1)
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            PUBLISHED="$OUT"
          elif grep -q "E404" <<<"$OUT"; then
            PUBLISHED=""
          else
            echo "npm registry lookup failed; not publishing:" >&2
            echo "$OUT" >&2
            exit 1
          fi
          ARGS=(--require-release)
          if [ -n "$PUBLISHED" ]; then
            ARGS+=(--published "$PUBLISHED")
          fi
          if [ -n "$TAG" ]; then
            ARGS+=(--tag "$TAG")
          fi
          python3 tools/check_release.py "${ARGS[@]}"

      - name: Check tooling advisories against the allow-list
        run: |
          npm audit --prefix tools/npm-publish --package-lock-only --json > npm-audit.json || true
          python3 tools/check_npm_audit.py --audit-json npm-audit.json --allowlist tools/npm-publish/advisory-allowlist.json

      - name: Run tests
        run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
