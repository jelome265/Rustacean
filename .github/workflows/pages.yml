# Static project site. Deployment runs only from main; pull requests validate and package the site without publishing it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate static site
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          document = Path("site/index.html")
          assert document.is_file() and document.stat().st_size > 0, "site/index.html is missing or empty"
          source = document.read_text(encoding="utf-8")
          assert "<!doctype html>" in source.lower(), "HTML5 doctype is missing"
          assert '<html lang="en">' in source, "Language declaration is missing"

          class SiteCheck(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.title = []
                  self.in_title = False
                  self.ids = set()
                  self.fragments = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if values.get("id"):
                      self.ids.add(values["id"])
                  if tag == "a" and values.get("href", "").startswith("#"):
                      self.fragments.append(values["href"][1:])
                  if tag == "title":
                      self.in_title = True

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title.append(data)

          check = SiteCheck()
          check.feed(source)
          assert "Rustacean" in "".join(check.title), "Page title must name Rustacean"
          missing = sorted(set(check.fragments) - check.ids)
          assert not missing, f"Broken in-page links: {missing}"
          print("Static site structure checks passed.")
          PY

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
