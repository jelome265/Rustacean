# Main CI gate. Required status-check names and active ruleset state are documented in CONTRIBUTING.md.
# Keep that list synchronized with these job names; the repository ruleset, not this comment, enforces merges.
#
# Security properties of this file:
#   * Default permissions are empty; each job declares the minimum it needs.
#   * Every third-party action is pinned to a full commit SHA; the tag is a comment.
#   * Checkout never persists credentials into the workspace.
#   * No pull_request_target trigger, so fork code never runs with secrets.
#   * Every job has a timeout, and concurrent runs for a pull request are cancelled.
#   * Nothing in this file merges, approves, or pushes to a protected branch.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-security:
    name: workflow-security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned CI tools
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true

      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format plain --min-severity medium .github/workflows

  validate-skills:
    name: validate-skills
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the release check diffs against the pull request base

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned CI tools
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Validate skill packages
        run: python tools/validate_skills.py skills

      - name: Check release metadata and changelog
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python3 tools/check_release.py --base "$BASE_SHA"
          else
            python3 tools/check_release.py
          fi

  python-tests:
    name: python-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned CI tools
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests/python -v

  shell-lint:
    name: shell-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned CI tools
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Shellcheck gate scripts
        run: find skills -name '*.sh' -type f -print0 | xargs -0 -r shellcheck -s bash -S warning

  rust-conformance:
    name: rust-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain is the exact pin in rust-toolchain.toml. rustup installs it on first use,
      # so no floating action version is involved.
      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy with warnings as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Documentation with warnings as errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
